server.document-root = "/opt/var/www"
server.port = 80
server.bind = "192.168.1.1"

server.modules = (
    "mod_auth",
    "mod_authn_file",
    "mod_cgi",
    "mod_access",
    "mod_accesslog",
    "mod_alias"
)

server.errorlog     = "/opt/var/log/lighttpd/error.log"
accesslog.filename  = "/opt/var/log/lighttpd/access.log"

index-file.names = ( "index.html" )

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon"
)

auth.backend = "plain"
auth.backend.plain.userfile = "/opt/etc/lighttpd/lighttpd.user"
auth.require = ( "/" =>
    (
        "method"  => "basic",
        "realm"   => "Reika-OS",
        "require" => "valid-user"
    )
)

alias.url = ( "/cgi-bin/" => "/opt/var/www/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "" )
}
